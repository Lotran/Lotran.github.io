<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>GLITCH_SYSTEM_STATS</title>
<style>body{background:#050505;color:#0f0;font-family:monospace;padding:20px} .stat{margin:10px 0;border-bottom:1px solid #0f0;padding:5px}</style>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💀</text></svg>">
</head>
<body>
  <h2>> SYSTEM_METRICS</h2>
  <div id="stats"></div>
  <script>
    const keys = Object.keys(localStorage).filter(k => k.startsWith('glitch_arg'));
    document.getElementById('stats').innerHTML = keys.length ? 
      keys.map(k => `<div class="stat">${k.replace('glitch_arg_', '')}: ${localStorage.getItem(k)}</div>`).join('') : 
      '<div class="stat">Нет данных. Ждём трафик...</div>';
  </script>
</body>
</html>
