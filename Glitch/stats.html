<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>GLITCH_SYSTEM_STATS</title>
<style>body{background:#050505;color:#0f0;font-family:monospace;padding:20px} .stat{margin:10px 0;border-bottom:1px solid #0f0;padding:5px}</style>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💀</text></svg>">
</head>
<body>
  <h2>> SYSTEM_METRICS</h2>
  <div id="stats"></div>
  <script>
async function loadGlobalStats() {
  const events = ['page_load', 'code_success', 'puzzle_solved', 'secret_layer_clicked'];
  const container = document.getElementById('stats');
  const NAMESPACE = 'glitch-arg-v1'; // Уникальное имя проекта
  let html = '<h3>🌍 ГЛОБАЛЬНАЯ СТАТИСТИКА (Все игроки)</h3>';

  for (let event of events) {
    try {
      // Сначала пытаемся получить данные
      let res = await fetch(`https://api.countapi.xyz/get/${NAMESPACE}/${event}`);
      let data = await res.json();
      
      // Если ошибка (счётчик не существует) — создаём его
      if (data.error || !data.value) {
        // Создаём счётчик с нулём
        await fetch(`https://api.countapi.xyz/hit/${NAMESPACE}/${event}`);
        html += `<div class="stat">⚪ ${event}: <b>0</b> (ожидание данных)</div>`;
      } else {
        html += `<div class="stat">📊 ${event}: <b style="color:#0f0">${data.value}</b></div>`;
      }
    } catch (e) {
      html += `<div class="stat" style="color:#f00">❌ ${event}: Нет соединения</div>`;
    }
  }
  
  // Добавляем инфо о локальной статистике
  html += '<br><h3>💾 ЛОКАЛЬНАЯ СТАТИСТИКА (Твой браузер)</h3>';
  const localKeys = Object.keys(localStorage).filter(k => k.startsWith('glitch_arg_'));
  if (localKeys.length > 0) {
    localKeys.forEach(key => {
      const value = localStorage.getItem(key);
      const eventName = key.replace('glitch_arg_', '');
      html += `<div class="stat">📁 ${eventName}: <b>${value}</b></div>`;
    });
  } else {
    html += '<div class="stat">Нет локальных данных</div>';
  }
  
  container.innerHTML = html;
}

// Функция сброса
function clearStats() {
  if (confirm("⚠️ Сбросить ЛОКАЛЬНУЮ статистику? Глобальная останется.")) {
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith('glitch_arg_')) {
        localStorage.removeItem(key);
      }
    });
    alert("✅ Локальные данные очищены");
    location.reload();
  }
}

// Запуск
document.addEventListener('DOMContentLoaded', loadGlobalStats);
  </script>
  <!-- Кнопка сброса -->
<div style="margin-top: 30px; border-top: 1px dashed #0f0; padding-top: 15px;">
  <button onclick="clearStats()" style="
    background: transparent; border: 1px solid #f00; color: #f00; 
    padding: 8px 16px; cursor: pointer; font-family: monospace; text-transform: uppercase;
  ">⚠️ СБРОСИТЬ СТАТИСТИКУ</button>
</div>

<script>
  function clearStats() {
    if (confirm("Точно удалить все накопленные данные? Это действие нельзя отменить.")) {
      // Проходим по всем ключам в localStorage
      Object.keys(localStorage).forEach(key => {
        // Если ключ начинается с префикса твоего проекта — удаляем
        if (key.startsWith('glitch_arg_')) {
          localStorage.removeItem(key);
        }
      });
      alert("Данные очищены. Перезагрузка...");
      location.reload(); // Перезагружаем страницу, чтобы видеть нули
    }
  }
</script>
</body>
</html>
