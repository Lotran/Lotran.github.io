<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SYSTEM_LOG // UNKNOWN_ROUTE</title>
  <style>
    /* ===== БАЗОВЫЕ СТИЛИ (как на index.html) ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      color: #0f0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,255,0,0.02) 0px, rgba(0,255,0,0.02) 1px, transparent 1px, transparent 2px);
      pointer-events: none; z-index: -1;
      animation: noise 0.15s infinite steps(1);
    }
    @keyframes noise {
      0% { transform: translate(0,0); } 50% { transform: translate(-1px,1px); } 100% { transform: translate(1px,-1px); }
    }

    .container {
      max-width: 750px; width: 100%; text-align: center; z-index: 1;
    }

    /* ===== ЗАГОЛОВОК ===== */
    .title {
      font-size: 1.5rem; text-transform: uppercase; letter-spacing: 3px;
      margin-bottom: 30px; text-shadow: 0 0 8px rgba(0,255,0,0.6);
      position: relative;
    }
    .glitch {
      position: relative; animation: glitch 4s infinite;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .glitch::before { color: #f00; animation: glitch-1 0.3s infinite linear alternate-reverse; clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); opacity: 0.7; }
    .glitch::after { color: #0ff; animation: glitch-2 0.3s infinite linear alternate-reverse; clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); opacity: 0.7; }
    @keyframes glitch { 0%,90%,100% { transform: translate(0); } 92% { transform: translate(-2px,1px); } 96% { transform: translate(1px,-1px); } }
    @keyframes glitch-1 { 0% { clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); transform: translate(-1px,0); } 100% { clip-path: polygon(0 10%, 100% 10%, 100% 30%, 0 30%); transform: translate(1px,0); } }
    @keyframes glitch-2 { 0% { clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); transform: translate(1px,0); } 100% { clip-path: polygon(0 70%, 100% 70%, 100% 90%, 0 90%); transform: translate(-1px,0); } }

    /* ===== ТЕРМИНАЛ / ЛОГ ===== */
    .terminal {
      background: rgba(0, 20, 0, 0.3);
      border: 1px solid #0f0;
      border-radius: 4px;
      padding: 25px;
      text-align: left;
      margin-bottom: 35px;
      box-shadow: 0 0 15px rgba(0,255,0,0.1);
      min-height: 280px;
      position: relative;
      overflow: hidden;
    }
    .terminal::after {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(transparent 50%, rgba(0,255,0,0.02) 50%);
      background-size: 100% 4px; pointer-events: none;
    }
    .log-line {
      margin: 6px 0; font-size: 0.95rem; line-height: 1.5; opacity: 0;
      transform: translateX(-5px);
      transition: opacity 0.3s, transform 0.3s;
    }
    .log-line.visible { opacity: 1; transform: translateX(0); }
    .log-line .prompt { color: #0f0; }
    .log-line .data { color: #0ff; }
    .log-line .warn { color: #f00; }
    .log-line .highlight { color: #ff0; font-weight: bold; }

    .cursor {
      display: inline-block; width: 8px; height: 16px; background: #0f0;
      animation: blink 0.8s step-end infinite; vertical-align: middle; margin-left: 4px;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ===== КНОПКИ ===== */
    .buttons { display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .btn {
      width: 100%; max-width: 380px; padding: 16px 20px;
      background: transparent; border: 2px solid #0f0; color: #0f0;
      font-family: 'Courier New', monospace; font-size: 1rem;
      text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
      text-decoration: none; display: inline-block; transition: all 0.2s;
      position: relative; overflow: hidden;
    }
    .btn::before {
      content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,255,0,0.2), transparent); transition: left 0.4s;
    }
    .btn:hover { background: rgba(0,255,0,0.1); box-shadow: 0 0 15px rgba(0,255,0,0.5); transform: translateY(-2px); }
    .btn:hover::before { left: 100%; }
    .btn.secondary { border-color: #0ff; color: #0ff; }
    .btn.secondary:hover { background: rgba(0,255,255,0.1); box-shadow: 0 0 15px rgba(0,255,255,0.5); }
    .btn.secondary::before { background: linear-gradient(90deg, transparent, rgba(0,255,255,0.2), transparent); }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 600px) {
      .title { font-size: 1.2rem; }
      .terminal { padding: 18px; min-height: 240px; }
      .log-line { font-size: 0.85rem; }
      .btn { padding: 14px 18px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title glitch" data-text="ОШИБКА МАРШРУТИЗАЦИИ">ОШИБКА МАРШРУТИЗАЦИИ</h1>
    
    <div class="terminal" id="log-container">
      <!-- Сюда JS будет построчно выводить лог -->
    </div>

    <div class="buttons">
      <a href="index.html" class="btn secondary">← ВЕРНУТЬСЯ К ВХОДУ</a>
      <!-- ЗАМЕНИТЕ ССЫЛКУ НА СВОЙ КАНАЛ -->
      <a href="https://youtube.com/@YOUR_CHANNEL" target="_blank" class="btn">▶ СМОТРЕТЬ АРХИВ</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('log-container');
      // Строки лога. \n = новая строка, <span> = стилизация
      const logData = [
        '<span class="prompt">> </span>Обнаружен внешний трафик...',
        '<span class="prompt">> </span>Маршрут: <span class="data">НЕИЗВЕСТНО</span>',
        '<span class="prompt">> </span>Статус: <span class="warn">[СЛУЧАЙНОЕ ПОПАДАНИЕ]</span>',
        '<span class="prompt">> </span>Инициализация протокола ознакомления...',
        '<br>',
        '<span class="highlight">Ты нашёл то, что не предназначалось для поиска.</span>',
        '«Глитч-файлы» — это повреждённые фрагменты данных, содержащие скрытые сигналы. Визуальный шум, QR-коды, обрывки символов... Всё это — части одной системы.',
        '<br>',
        '<span class="prompt">> </span>ПРОТОКОЛ УЧАСТИЯ:',
        '<span class="data">1.</span> Смотри видео на канале.',
        '<span class="data">2.</span> Ищи скрытые QR-коды в помехах.',
        '<span class="data">3.</span> Отсканируй → получи символы.',
        '<span class="data">4.</span> Вернись на главную и введи ключ.',
        '<br>',
        '<span class="warn">⚠ ВНИМАНИЕ:</span> Коды меняются. Ошибки фиксируются.'
      ];

      let lineIndex = 0;
      const speed = 40; // мс между строками
      const delayBetweenLines = 600; // пауза перед следующей строкой

      function typeLine() {
        if (lineIndex >= logData.length) return;
        
        const div = document.createElement('div');
        div.className = 'log-line';
        div.innerHTML = logData[lineIndex] + '<span class="cursor"></span>';
        container.appendChild(div);

        // Небольшая задержка для "появления" строки
        requestAnimationFrame(() => {
          div.classList.add('visible');
          // Убираем курсор у предыдущих строк
          document.querySelectorAll('.cursor').forEach((c, i) => {
            if (i < document.querySelectorAll('.log-line').length - 1) c.remove();
          });
        });

        lineIndex++;
        setTimeout(typeLine, delayBetweenLines);
      }

      // Запуск печатной машинки
      setTimeout(typeLine, 500);
    });
  </script>
</body>
</html>
